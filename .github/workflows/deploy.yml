name: Deploy API Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to OCI Instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT || 22 }}
          script: |
            cd ~/apps/EdgeTech.API
            git reset --hard HEAD
            git pull origin main
            docker build -t edgetech-api:latest .
            docker stop edgetech-api-container || true
            docker rm edgetech-api-container || true
            docker run -d \
              --name edgetech-api-container \
              --restart unless-stopped \
              -p 5000:5000 \
              -e Frontend__Url=http://${{ secrets.OCI_HOST }}:3000,http://localhost:3000 \
              edgetech-api:latest
